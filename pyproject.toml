[project]
name = "industrial-icon-designer"
version = "0.1.0"
description = "Claude Code skill that redesigns industrial/SCADA icon sets and exports Desktop PNG and Web SVG assets"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "Pillow>=10",
  "jsonschema>=4",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/industrial-icon-designer/scripts"]
